# Charged B/Bc HNL production definitions.
#
# Physics PDG convention:
#   B+   =  521, mu+ = -13
#   B-   = -521, mu- =  13
#   Bc+  =  541, mu+ = -13
#   Bc-  = -541, mu- =  13
#
# PYTHIA stores particle/antiparticle decay tables under the positive parent
# entry. Configuring +521 or +541 therefore also configures the charge-conjugate
# negative parent.  The signed legacy selections are kept only for old tests.
#
# forced_br: 1.0 is intentionally an efficiency setting for detector-occupancy
# studies. It is NOT a physical B/Bc -> mu HNL branching fraction.

particles:
  - name: "B+"
    id: 521
    cmd: "521:new  B+               B-    1   3   0    5.27934    0.00000    0.00000    0.00000  4.91e-01   0   1   0   1   0"

  - name: "B_c+"
    id: 541
    cmd: "541:new  B_c+             B_c-  1   3   0    6.27447    0.00000    0.00000    0.00000  1.53e-01   0   1   0   1   0"

selections:
  # Both charges are generated through PYTHIA charge conjugation.
  b:
    parameters:
      - "HardQCD::hardbbbar = on"
    particles:
      - 521

  bc:
    parameters:
      - "HardQCD::hardbbbar = on"
    particles:
      - 541

  # Backward-compatible charge-specific selections.
  bplus:
    parameters:
      - "HardQCD::hardbbbar = on"
    particles:
      - 521

  bminus:
    parameters:
      - "HardQCD::hardbbbar = on"
    particles:
      - -521

channels:
  # Forced channels are intended for kinematic/occupancy studies.  The proper
  # physical branching-ratio weighting must be applied separately.
  - id: 521
    decay: "b_mu"
    coupling: 1
    idlepton: -13
    forced_br: 1.0

  - id: -521
    decay: "b_mu"
    coupling: 1
    idlepton: 13
    forced_br: 1.0

  - id: 541
    decay: "bc_mu"
    coupling: 1
    idlepton: -13
    forced_br: 1.0

  - id: -541
    decay: "bc_mu"
    coupling: 1
    idlepton: 13
    forced_br: 1.0
